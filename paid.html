<body><div class="box">
<img src="/logo.png" alt="">
<h1 id="paymentTitle">Проверяем статус оплаты</h1>
<p id="paymentMessage">Подтверждение поступает от платёжного сервиса. Если вы закрыли страницу оплаты, вернитесь к ней по ссылке из счёта.</p>
<button id="paymentRetry" style="display:none" type="button">Проверить ещё раз</button>
<a class="btn" href="/">На главную</a><a class="btn tg" href="https://t.me/daldobro_bot">Наш Telegram</a>
</div><script>
(function(){
  'use strict';
  const title=document.getElementById('paymentTitle'),msg=document.getElementById('paymentMessage'),retry=document.getElementById('paymentRetry');
  let pending=null,busy=false;
  const invoice=new URLSearchParams(location.search).get('p')||'';
  const validInvoice=/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(invoice);
  try{pending=JSON.parse(sessionStorage.getItem('dd_pending_payment')||'null')}catch(e){}
  async function check(){
    if(busy)return;
    if(!validInvoice&&(!pending||typeof pending.yk!=='string'||Date.now()-Number(pending.created)>86400000)){
      title.textContent='Проверьте подтверждение оплаты';
      msg.textContent='На этой странице нет номера вашего счёта. Статус можно проверить на странице оформления, где вы получили ссылку на оплату. Подтверждение и доступ придут на указанный e-mail.';
      return;
    }
    busy=true;retry.style.display='none';
    const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),20000);
    try{
      const r=await fetch('https://app.daldobro.ru/pay/status?'+(validInvoice?'p='+encodeURIComponent(invoice):'yk='+encodeURIComponent(pending.yk)),{signal:abort.signal,cache:'no-store'});
      if(!r.ok||!(r.headers.get('content-type')||'').includes('application/json'))throw Error('status');
      const d=await r.json();
      if(d.status==='succeeded'&&d.paid===true){
        title.textContent='Оплата подтверждена';
        msg.textContent='Спасибо! Услуга активируется автоматически. Подтверждение и инструкции придут на указанный e-mail. Обработка может занять несколько минут.';
      }else if(d.status==='canceled'){
        title.textContent='Оплата отменена';msg.textContent='Этот счёт не оплачен. Вернитесь на страницу тарифов, чтобы оформить новый.';
      }else{
        title.textContent='Ожидаем подтверждение оплаты';msg.textContent='Платёжный сервис ещё не подтвердил списание. Если вы уже оплатили, проверьте статус через минуту.';retry.style.display='inline-block';
      }
    }catch(e){title.textContent='Статус пока недоступен';msg.textContent='Не удалось получить ответ платёжного сервиса. Проверьте статус позже; повторно оплачивать счёт сейчас не нужно.';retry.style.display='inline-block';}
    finally{clearTimeout(timer);busy=false;}
  }
  retry.addEventListener('click',check);check();
})();
